<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>接收端 · 文本接收</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #1f2937 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
        }
        .receiver-card {
            background: rgba(15, 20, 30, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 40px;
            padding: 32px 24px;
            width: 100%;
            max-width: 540px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7);
            color: #f1f5f9;
        }
        h2 {
            font-weight: 400;
            font-size: 1.9rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .subhead {
            font-size: 0.9rem;
            color: #a7b6d0;
            margin-bottom: 28px;
            border-left: 3px solid #38bdf8;
            padding-left: 12px;
            font-weight: 300;
        }
        .room-section {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 32px;
            padding: 20px 22px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .room-label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        .room-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid #475569;
            color: white;
            font-size: 1.6rem;
            padding: 10px 4px;
            font-weight: 400;
            letter-spacing: 2px;
            outline: none;
            transition: border-color 0.2s;
        }
        .room-input:focus {
            border-bottom-color: #38bdf8;
        }
        .room-input::placeholder {
            color: #526078;
            font-weight: 300;
        }
        .received-panel {
            background: #0b111e;
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 28px;
            min-height: 210px;
            border: 1px solid #2b3a52;
            box-shadow: inset 0 4px 16px rgba(0, 0, 0, 0.6);
        }
        .received-label {
            font-size: 0.9rem;
            color: #8fa3c0;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }
        .received-message {
            font-size: 1.25rem;
            line-height: 1.6;
            color: #e6edf7;
            word-break: break-word;
            white-space: pre-wrap;
            min-height: 100px;
            background: rgba(255, 255, 255, 0.02);
            padding: 16px;
            border-radius: 20px;
            border: 1px dashed #3a4b68;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            flex: 1;
            min-width: 130px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px 18px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 1px;
            color: #e2e8f0;
            cursor: pointer;
            transition: all 0.25s;
            backdrop-filter: blur(5px);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-join {
            background: #0d9488;
            border-color: #0d9488;
            box-shadow: 0 8px 20px rgba(13, 148, 136, 0.4);
            color: white;
        }
        .btn-join:hover {
            background: #0f766e;
            transform: translateY(-2px);
        }
        .btn-clear {
            background: #1e293b;
            border-color: #3b4a63;
        }
        .btn-clear:hover {
            background: #334155;
        }
        .log {
            margin-top: 24px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 16px;
            font-size: 0.85rem;
            color: #b0c0da;
            min-height: 52px;
            display: flex;
            align-items: center;
            word-break: break-word;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #facc15;
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 12px #facc15;
        }
        .footer-note {
            margin-top: 18px;
            font-size: 0.75rem;
            color: #5f7090;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="receiver-card">
        <h2>
            <span>📥</span> 接收端
        </h2>
        <div class="subhead">加入同一房间 · 在线接收文本</div>

        <div class="room-section">
            <label class="room-label" for="receiverRoomInput">🔑 输入发送端的房间号</label>
            <input type="text" id="receiverRoomInput" class="room-input" placeholder="例如：demo-salon" value="demo-salon" maxlength="60" autocomplete="off">
        </div>

        <div class="received-panel">
            <div class="received-label">
                <span>📄</span> 收到的文本消息
            </div>
            <div id="receivedMessage" class="received-message">等待发送端发送内容...</div>
        </div>

        <div class="btn-group">
            <button id="joinRoomBtn" class="btn btn-join">
                <span>🔌</span> 加入/重连
            </button>
            <button id="clearMsgBtn" class="btn btn-clear">
                <span>🧾</span> 清空消息
            </button>
        </div>

        <div id="statusLog" class="log">
            <span class="status-dot"></span>
            <span id="logText">请点击“加入”或修改房间后加入</span>
        </div>
        <div class="footer-note">
            点对点连接 · 不经过服务器 (仅使用本地信令)
        </div>
    </div>

    <script>
        (function() {
            const roomInput = document.getElementById('receiverRoomInput');
            const receivedMessageDiv = document.getElementById('receivedMessage');
            const joinBtn = document.getElementById('joinRoomBtn');
            const clearMsgBtn = document.getElementById('clearMsgBtn');
            const logText = document.getElementById('logText');

            let localConnection = null;
            let dataChannel = null;
            let signalingChannel = null;
            let currentRoom = roomInput.value.trim() || 'demo-salon';
            const SIGNAL_PREFIX = 'webrtc-text-room-';

            function updateLog(msg) {
                logText.innerText = msg;
            }

            function closeAll() {
                if (dataChannel) {
                    dataChannel.close();
                    dataChannel = null;
                }
                if (localConnection) {
                    localConnection.close();
                    localConnection = null;
                }
                if (signalingChannel) {
                    signalingChannel.close();
                    signalingChannel = null;
                }
            }

            function joinRoom() {
                const room = roomInput.value.trim();
                if (!room) {
                    updateLog('⚠️ 请输入房间号');
                    return;
                }

                // 关闭旧连接
                closeAll();
                currentRoom = room;
                updateLog('🔄 正在加入房间 [' + room + '] ...');

                // 创建信令 BroadcastChannel
                signalingChannel = new BroadcastChannel(SIGNAL_PREFIX + room);

                // 创建 RTCPeerConnection (接收端)
                const configuration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
                localConnection = new RTCPeerConnection(configuration);

                // 接收端处理数据通道 (由发送端创建)
                localConnection.ondatachannel = (event) => {
                    dataChannel = event.channel;
                    dataChannel.onopen = () => {
                        updateLog('🔗 数据通道已打开，可以接收消息');
                    };
                    dataChannel.onclose = () => {
                        updateLog('⛔ 数据通道关闭');
                    };
                    dataChannel.onerror = (err) => {
                        updateLog('⚠️ 数据通道错误');
                    };
                    dataChannel.onmessage = (event) => {
                        const msg = event.data;
                        if (typeof msg === 'string') {
                            receivedMessageDiv.innerText = msg;
                            updateLog('📩 收到新消息 (' + msg.length + ' 字符)');
                        }
                    };
                };

                // ICE 候选
                localConnection.onicecandidate = (event) => {
                    if (event.candidate && signalingChannel) {
                        signalingChannel.postMessage({
                            type: 'ice-candidate',
                            candidate: event.candidate,
                            from: 'receiver'
                        });
                    }
                };

                // 监听连接状态
                localConnection.onconnectionstatechange = () => {
                    if (localConnection) {
                        const state = localConnection.connectionState;
                        if (state === 'connected') {
                            updateLog('🟢 已连接发送端');
                        } else if (state === 'disconnected' || state === 'failed' || state === 'closed') {
                            updateLog('🔴 连接断开: ' + state);
                        }
                    }
                };

                // 处理信令消息
                signalingChannel.onmessage = (event) => {
                    const msg = event.data;
                    if (!msg || !msg.from) return;
                    if (msg.from !== 'sender') return;  // 只处理来自发送端的信令

                    switch (msg.type) {
                        case 'sender-ready':
                            // 发送端已就绪，通知发送端接收端加入
                            if (signalingChannel) {
                                signalingChannel.postMessage({
                                    type: 'receiver-joined',
                                    from: 'receiver'
                                });
                            }
                            updateLog('👋 已向发送端发送加入请求');
                            break;
                        case 'offer':
                            if (localConnection && msg.offer) {
                                localConnection.setRemoteDescription(new RTCSessionDescription(msg.offer))
                                    .then(() => {
                                        return localConnection.createAnswer();
                                    })
                                    .then(answer => {
                                        return localConnection.setLocalDescription(answer);
                                    })
                                    .then(() => {
                                        if (signalingChannel) {
                                            signalingChannel.postMessage({
                                                type: 'answer',
                                                answer: localConnection.localDescription,
                                                from: 'receiver'
                                            });
                                        }
                                    })
                                    .catch(e => updateLog('❌ 处理 offer 失败: ' + e.message));
                            }
                            break;
                        case 'ice-candidate':
                            if (localConnection && msg.candidate) {
                                localConnection.addIceCandidate(new RTCIceCandidate(msg.candidate))
                                    .catch(e => console.warn('添加 ICE 失败', e));
                            }
                            break;
                        default:
                            console.log('未知信令', msg.type);
                    }
                };

                // 额外发送一个加入请求，同时应对发送端先创建但未广播的情况
                if (signalingChannel) {
                    signalingChannel.postMessage({
                        type: 'receiver-joined',
                        from: 'receiver'
                    });
                }
                updateLog('📡 已加入房间 [' + room + ']，等待发送端...');
            }

            // 事件监听
            joinBtn.addEventListener('click', joinRoom);
            clearMsgBtn.addEventListener('click', () => {
                receivedMessageDiv.innerText = '等待发送端发送内容...';
                updateLog('🗑️ 已清空显示');
            });

            roomInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    joinRoom();
                }
            });

            // 初始自动尝试加入默认房间
            window.addEventListener('load', () => {
                // 延迟一点点确保所有元素就绪
                setTimeout(() => {
                    joinRoom();
                }, 300);
            });

            window.addEventListener('beforeunload', () => {
                closeAll();
            });
        })();
    </script>
</body>
</html>
