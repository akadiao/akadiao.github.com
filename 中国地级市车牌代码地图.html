<html lang="zh-CN">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #0a1628;
      color: #e0e6f0;
      overflow: hidden;
      height: 100vh;
    }
    #app { display: flex; height: 100vh; width: 100vw; }
    #sidebar {
      width: 280px;
      background: #0f1d32;
      border-right: 1px solid #1e3a5f;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 16px;
      flex-shrink: 0;
    }
    #sidebar h1 {
      font-size: 18px;
      font-weight: 600;
      color: #4fc3f7;
      letter-spacing: 1px;
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e3a5f;
    }
    #sidebar label {
      font-size: 13px;
      color: #8aa4c8;
      margin-bottom: 4px;
      display: block;
    }
    #provinceSelect {
      width: 100%;
      padding: 8px 12px;
      background: #162540;
      border: 1px solid #2a4a6f;
      border-radius: 6px;
      color: #e0e6f0;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }
    #provinceSelect:focus { border-color: #4fc3f7; }
    #provinceSelect option { background: #162540; color: #e0e6f0; }
    #infoPanel {
      flex: 1;
      overflow-y: auto;
      background: #12253e;
      border-radius: 8px;
      padding: 14px;
      border: 1px solid #1e3a5f;
      min-height: 0;
    }
    #infoPanel h3 {
      font-size: 15px;
      color: #4fc3f7;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #1e3a5f;
    }
    #infoPanel .city-item {
      padding: 8px 10px;
      margin-bottom: 4px;
      border-radius: 5px;
      background: #162540;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s;
    }
    #infoPanel .city-item:hover { background: #1e3555; }
    #infoPanel .city-item .name { color: #c0d4ee; }
    #infoPanel .city-item .plate {
      color: #ffab40;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.5px;
    }
    #infoPanel .city-item.multi .plate { color: #ff6e40; }
    #infoPanel .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: #162540;
      border-radius: 5px;
      margin-bottom: 4px;
      font-size: 13px;
    }
    #infoPanel .stat-row span { color: #8aa4c8; }
    #infoPanel .stat-row b { color: #4fc3f7; font-size: 16px; }
    #infoPanel::-webkit-scrollbar { width: 5px; }
    #infoPanel::-webkit-scrollbar-thumb { background: #2a4a6f; border-radius: 3px; }
    #infoPanel .empty-tip {
      color: #5a7a9e;
      font-size: 13px;
      text-align: center;
      padding-top: 40px;
      line-height: 1.8;
    }
    #chartWrapper { flex: 1; position: relative; min-width: 0; }
    #chart { width: 100%; height: 100%; }
    #backBtn {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      padding: 7px 16px;
      background: rgba(15, 29, 50, 0.9);
      border: 1px solid #2a4a6f;
      border-radius: 6px;
      color: #4fc3f7;
      font-size: 13px;
      cursor: pointer;
      display: none;
      transition: all 0.2s;
      backdrop-filter: blur(6px);
    }
    #backBtn:hover { background: #1a3050; border-color: #4fc3f7; }
    #legendBox {
      position: absolute;
      bottom: 16px;
      right: 16px;
      z-index: 10;
      background: rgba(10, 22, 40, 0.85);
      border: 1px solid #1e3a5f;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 11px;
      color: #8aa4c8;
      line-height: 1.8;
      backdrop-filter: blur(6px);
    }
    #legendBox span.dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      margin-right: 5px;
      vertical-align: middle;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #4fc3f7;
      font-size: 14px;
      z-index: 20;
      background: rgba(10, 22, 40, 0.9);
      padding: 14px 28px;
      border-radius: 8px;
      border: 1px solid #1e3a5f;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>

    // ============================================================
    // 工具函数
    // ============================================================
    function getPlateDisplay(cityName) {
      const d = PLATE_DATA[cityName];
      if (!d) return null;
      if (typeof d === "string") return { plate: [d], isMulti: false, isDirect: false };
      return {
        plate: d.plate || [d],
        isMulti: (d.plate && d.plate.length > 1) || false,
        isDirect: d.isDirect || false,
      };
    }

    function getProvinceOfCity(cityName) {
      for (const [prov, cities] of Object.entries(PROVINCE_CITY_MAP)) {
        if (cities.includes(cityName)) return prov;
      }
      return null;
    }

    // ============================================================
    // ECharts 初始化
    // ============================================================
    const chartDom = document.getElementById("chart");
    const chart = echarts.init(chartDom, null, { renderer: "canvas" });
    const loadingEl = document.getElementById("loading");
    const backBtn = document.getElementById("backBtn");
    const provinceSelect = document.getElementById("provinceSelect");
    const infoPanel = document.getElementById("infoPanel");

    let currentLevel = "china";
    let currentProvince = null;
    let selectedCityName = null;
    let renderToken = 0;
    const geoJsonCache = {};

    // 填充省份下拉框
    Object.keys(PROVINCE_INFO).forEach(p => {
      const opt = document.createElement("option");
      opt.value = p;
      opt.textContent = p;
      provinceSelect.appendChild(opt);
    });

    // ============================================================
    // 网络请求
    // ============================================================
    async function fetchGeoJson(adcode) {
      if (geoJsonCache[adcode]) return geoJsonCache[adcode];
      const urls = [
        `https://geo.datav.aliyun.com/areas_v3/bound/${adcode}_full.json`,
        `https://geo.datav.aliyun.com/areas_v3/bound/${adcode}.json`,
      ];
      for (const url of urls) {
        try {
          const resp = await fetch(url);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const json = await resp.json();
          geoJsonCache[adcode] = json;
          return json;
        } catch (e) {
          console.warn("请求失败:", url, e.message);
        }
      }
      return null;
    }

    // ============================================================
    // 构建全国地级市 GeoJSON（合并各省地级市 + 直辖市整体）
    // ============================================================
    async function loadAllCityGeoJson(onProgress) {
      if (geoJsonCache["china_cities"]) {
        if (onProgress) onProgress(1, 1);
        return geoJsonCache["china_cities"];
      }

      const provinceGeo = await fetchGeoJson("100000_full");
      if (!provinceGeo || !provinceGeo.features) return null;

      const DIRECT = ["北京市", "天津市", "上海市", "重庆市"];
      const features = [];

      // 1. 直辖市整体 + 港澳台（保留省级 feature）
      provinceGeo.features.forEach(f => {
        const n = f.properties && f.properties.name;
        if (DIRECT.includes(n) || !PROVINCE_INFO[n]) {
          features.push(f);
        }
      });

      // 2. 各省的地级市
      const provNames = Object.keys(PROVINCE_INFO).filter(n => !DIRECT.includes(n) && n !== "香港特别行政区" && n !== "澳门特别行政区");
      const total = provNames.length;
      let done = 0;

      const results = await Promise.all(provNames.map(async (pName) => {
        const info = PROVINCE_INFO[pName];
        try {
          const json = await fetchGeoJson(info.adcode);
          return json && json.features ? json.features : [];
        } catch (e) {
          console.warn("加载失败:", pName, e);
          return [];
        } finally {
          done++;
          if (onProgress) onProgress(done, total);
        }
      }));

      results.forEach(arr => features.push(...arr));

      const merged = { type: "FeatureCollection", features };
      geoJsonCache["china_cities"] = merged;
      return merged;
    }

    // ============================================================
    // 渲染全国地图（地级市视图）
    // ============================================================
    async function renderChinaMap() {
      const token = ++renderToken;
      currentLevel = "china";
      currentProvince = null;
      selectedCityName = null;
      backBtn.style.display = "none";
      provinceSelect.value = "china";
      loadingEl.style.display = "block";
      loadingEl.textContent = "加载全国地图...";

      // 1. 先用省级地图快速占位渲染
      const provGeo = await fetchGeoJson("100000_full");
      if (token !== renderToken) return;
      if (provGeo) {
        echarts.registerMap("china_provinces_preview", provGeo);
        chart.setOption({
          tooltip: { show: false },
          series: [{
            type: "map",
            map: "china_provinces_preview",
            roam: false,
            zoom: 1.15,
            center: [104, 36],
            silent: true,
            label: {
              show: true,
              fontSize: 9,
              color: "#4fc3f7",
              lineHeight: 12,
              formatter: (p) => {
                const s = PROVINCE_INFO[p.name] ? PROVINCE_INFO[p.name].short : "";
                return s ? `${p.name}\n${s}` : p.name;
              },
            },
            itemStyle: { areaColor: "#152a45", borderColor: "#2a5a8f", borderWidth: 0.8 },
          }],
        }, true);
      }

      // 2. 加载地级市数据
      loadingEl.textContent = "正在加载地级市详细数据...";
      const geoJson = await loadAllCityGeoJson((d, t) => {
        if (token !== renderToken) return;
        loadingEl.textContent = `正在加载地级市数据 ${d}/${t} ...`;
      });

      if (token !== renderToken) return;
      if (!geoJson || !geoJson.features || geoJson.features.length === 0) {
        loadingEl.textContent = "地图数据加载失败，请检查网络后刷新";
        return;
      }

      echarts.registerMap("china_cities", geoJson);

      // 构建 series data
      const cityData = geoJson.features.map(f => {
        const name = f.properties && f.properties.name;
        if (!name) return null;
        const pd = getPlateDisplay(name);
        const isMulti = pd && pd.isMulti;
        const item = { name: name, value: isMulti ? 2 : 1 };
        if (isMulti) {
          item.label = { color: "#ff6e40", fontWeight: "bold", fontSize: 7.5 };
        }
        return item;
      }).filter(Boolean);

      const option = {
        tooltip: {
          trigger: "item",
          backgroundColor: "rgba(15,29,50,0.95)",
          borderColor: "#2a4a6f",
          textStyle: { color: "#e0e6f0", fontSize: 12 },
          formatter: (params) => {
            if (params.componentType !== "series") return params.name;
            const name = params.name;
            const pd = getPlateDisplay(name);
            let html = `<b style="color:#4fc3f7;font-size:13px;">${name}</b>`;
            if (pd) {
              html += `<br/><span style="color:#8aa4c8;">车牌代码：</span><b style="color:#ffab40;">${pd.plate.join(" / ")}</b>`;
              if (pd.isMulti) html += `<br/><span style="color:#ff6e40;font-size:11px;">⚠ 多字母城市</span>`;
              if (pd.isDirect) html += `<br/><span style="color:#5a7a9e;font-size:11px;">直辖市 · 全市通用</span>`;
            } else {
              html += `<br/><span style="color:#5a7a9e;">暂无车牌数据</span>`;
            }
            const prov = getProvinceOfCity(name);
            if (prov && prov !== name) {
              html += `<br/><span style="color:#5a7a9e;font-size:11px;">所属：${prov}</span>`;
            }
            html += `<br/><span style="color:#3a5a7e;font-size:10px;">单击查看详情 · 双击进入省份</span>`;
            return html;
          },
        },
        series: [{
          type: "map",
          map: "china_cities",
          roam: true,
          zoom: 1.1,
          center: [104, 36],
          selectedMode: "single",
          label: {
            show: true,
            fontSize: 7,
            lineHeight: 9.5,
            color: "#9ab8d8",
            formatter: (params) => {
              const name = params.name;
              const pd = getPlateDisplay(name);
              if (!pd) return name;
              if (pd.isDirect) return `${name}\n${pd.plate[0].charAt(0)}`;
              return `${name}\n${pd.plate.join(" ")}`;
            },
          },
          labelLayout: { hideOverlap: true },
          itemStyle: {
            areaColor: "#152a45",
            borderColor: "#1e3a5f",
            borderWidth: 0.5,
          },
          emphasis: {
            label: { show: true, color: "#ffffff", fontSize: 9, fontWeight: "bold" },
            itemStyle: { areaColor: "#2a5a8f", borderColor: "#4fc3f7", borderWidth: 1.5 },
          },
          select: {
            label: { show: true, color: "#ffffff", fontSize: 9, fontWeight: "bold" },
            itemStyle: { areaColor: "#1e5a8f", borderColor: "#4fc3f7", borderWidth: 2 },
          },
          data: cityData,
        }],
      };

      chart.setOption(option, true);
      loadingEl.style.display = "none";
      updateInfoPanel(null);

      // 事件绑定
      chart.off("click");
      chart.off("dblclick");

      chart.on("click", (params) => {
        if (params.componentType !== "series") return;
        const name = params.name;
        if (!name) return;
        selectedCityName = name;
        updateInfoPanel(name);
      });

      chart.on("dblclick", (params) => {
        if (params.componentType !== "series") return;
        const name = params.name;
        const prov = getProvinceOfCity(name);
        if (prov && PROVINCE_INFO[prov]) {
          provinceSelect.value = prov;
          drillToProvince(prov);
        }
      });
    }

    // ============================================================
    // 下钻到省份
    // ============================================================
    async function drillToProvince(provinceName) {
      const info = PROVINCE_INFO[provinceName];
      if (!info) return;

      const token = ++renderToken;
      currentLevel = "province";
      currentProvince = provinceName;
      selectedCityName = null;
      backBtn.style.display = "block";
      loadingEl.style.display = "block";
      loadingEl.textContent = `${provinceName} 地图加载中...`;

      const DIRECT = ["北京市", "上海市", "天津市", "重庆市"];
      const isDirect = DIRECT.includes(provinceName);

      let geoJson;
      if (isDirect) {
        const provGeo = await fetchGeoJson("100000_full");
        if (token !== renderToken) return;
        const f = provGeo && provGeo.features
          ? provGeo.features.find(x => x.properties && x.properties.name === provinceName)
          : null;
        geoJson = { type: "FeatureCollection", features: f ? [f] : [] };
      } else {
        geoJson = await fetchGeoJson(info.adcode);
      }

      if (token !== renderToken) return;
      if (!geoJson || !geoJson.features || geoJson.features.length === 0) {
        loadingEl.textContent = "地图数据加载失败";
        return;
      }

      echarts.registerMap(provinceName, geoJson);
      provinceSelect.value = provinceName;

      const cities = PROVINCE_CITY_MAP[provinceName] || [];

      let seriesData = [];
      if (isDirect) {
        const pd = PLATE_DATA[provinceName];
        const plateStr = pd.plate ? pd.plate.join(" ") : "";
        seriesData = [{
          name: provinceName,
          value: 1,
          label: {
            show: true,
            formatter: `${provinceName}\n${plateStr}`,
            fontSize: 11,
            color: "#ffab40",
            lineHeight: 18,
            fontWeight: "bold",
          },
        }];
      } else {
        seriesData = cities.map(city => {
          const pd = getPlateDisplay(city);
          if (!pd) {
            return { name: city, value: 0, label: { show: true, formatter: city, fontSize: 9, color: "#8aa4c8" } };
          }
          const plateStr = pd.plate.join(" ");
          const isMulti = pd.isMulti;
          return {
            name: city,
            value: isMulti ? 2 : 1,
            label: {
              show: true,
              formatter: isMulti ? `${city}\n${plateStr}` : `${city} ${plateStr}`,
              fontSize: isMulti ? 9 : 8,
              color: isMulti ? "#ff6e40" : "#c0d4ee",
              lineHeight: isMulti ? 14 : 12,
              fontWeight: isMulti ? "bold" : "normal",
            },
          };
        });
      }

      let minLng = Infinity, maxLng = -Infinity, minLat = Infinity, maxLat = -Infinity;
      geoJson.features.forEach(f => {
        const coords = f.geometry && f.geometry.coordinates;
        const flatten = (arr) => {
          if (typeof arr[0] === "number") {
            minLng = Math.min(minLng, arr[0]);
            maxLng = Math.max(maxLng, arr[0]);
            minLat = Math.min(minLat, arr[1]);
            maxLat = Math.max(maxLat, arr[1]);
          } else if (Array.isArray(arr)) {
            arr.forEach(flatten);
          }
        };
        if (coords) flatten(coords);
      });

      const centerLng = (minLng + maxLng) / 2;
      const centerLat = (minLat + maxLat) / 2;
      const lngSpan = maxLng - minLng;
      const latSpan = maxLat - minLat;
      let zoom = 1.2;
      if (lngSpan > 0 && latSpan > 0) {
        const maxSpan = Math.max(lngSpan, latSpan);
        if (maxSpan < 2) zoom = 4;
        else if (maxSpan < 5) zoom = 2.5;
        else if (maxSpan < 10) zoom = 1.8;
        else if (maxSpan < 20) zoom = 1.2;
        else zoom = 0.8;
      }
      if (isDirect) {
        if (provinceName === "北京市" || provinceName === "天津市") zoom = 8;
        else if (provinceName === "上海市") zoom = 10;
        else if (provinceName === "重庆市") zoom = 3.5;
      }

      const option = {
        tooltip: {
          trigger: "item",
          backgroundColor: "rgba(15,29,50,0.95)",
          borderColor: "#2a4a6f",
          textStyle: { color: "#e0e6f0", fontSize: 12 },
          formatter: (params) => {
            if (params.componentType !== "series") return params.name;
            const cityName = params.name;
            const pd = getPlateDisplay(cityName);
            if (!pd) return cityName;
            const plateStr = pd.plate.join(" / ");
            let html = `<b style="color:#4fc3f7;font-size:13px;">${cityName}</b><br/>`;
            html += `<span style="color:#8aa4c8;">车牌代码：</span><b style="color:#ffab40;">${plateStr}</b>`;
            if (pd.isMulti) html += ` <span style="color:#ff6e40;">（多字母城市）</span>`;
            if (pd.isDirect) html += `<br/><span style="color:#5a7a9e;">直辖市 · 全市通用</span>`;
            return html;
          },
        },
        series: [{
          type: "map",
          map: provinceName,
          roam: true,
          zoom: zoom,
          center: [centerLng, centerLat],
          selectedMode: "single",
          label: {
            show: true,
            fontSize: 8,
            color: "#c0d4ee",
          },
          labelLayout: { hideOverlap: true },
          itemStyle: {
            areaColor: "#1a3050",
            borderColor: "#2a5a8f",
            borderWidth: 0.8,
          },
          emphasis: {
            itemStyle: { areaColor: "#2a5a8f", borderColor: "#4fc3f7", borderWidth: 1.5 },
            label: { color: "#ffffff", fontSize: 10, fontWeight: "bold" },
          },
          select: {
            itemStyle: { areaColor: "#1e5a8f", borderColor: "#4fc3f7", borderWidth: 2 },
            label: { color: "#ffffff", fontWeight: "bold" },
          },
          data: seriesData,
        }],
      };

      chart.setOption(option, true);
      loadingEl.style.display = "none";

      chart.off("click");
      chart.off("dblclick");
      chart.on("click", (params) => {
        if (params.componentType !== "series") return;
        const cityName = params.name;
        if (!cityName) return;
        selectedCityName = cityName;
        updateInfoPanel(cityName);
      });

      updateInfoPanel(null);
    }

    // ============================================================
    // 右侧信息面板
    // ============================================================
    function updateInfoPanel(cityName) {
      if (!cityName) {
        if (currentLevel === "china") {
          const allCityNames = Object.keys(PLATE_DATA);
          const multiCities = allCityNames.filter(n => {
            const d = PLATE_DATA[n];
            return d && typeof d === "object" && d.plate && d.plate.length > 1;
          });
          let html = `<h3>全国概览（地级市视图）</h3>`;
          html += `<div class="stat-row"><span>收录地级行政区</span><b>${allCityNames.length}</b></div>`;
          html += `<div class="stat-row"><span>多字母城市</span><b style="color:#ff6e40;">${multiCities.length}</b></div>`;
          html += `<div style="font-size:11px;color:#5a7a9e;margin:12px 0 6px;">多字母城市列表（单击定位）</div>`;
          multiCities.forEach(c => {
            const pd = PLATE_DATA[c];
            html += `<div class="city-item multi" style="cursor:pointer;" onclick="selectCity('${c}')">
              <span class="name">${c}</span>
              <span class="plate">${pd.plate.join(" ")}</span>
            </div>`;
          });
          infoPanel.innerHTML = html;
          return;
        }

        if (currentLevel === "province" && currentProvince) {
          const cities = PROVINCE_CITY_MAP[currentProvince] || [];
          const isDirect = ["北京市", "上海市", "天津市", "重庆市"].includes(currentProvince);

          if (isDirect) {
            const pd = PLATE_DATA[currentProvince];
            const plateStr = pd.plate.join(" / ");
            infoPanel.innerHTML = `
              <h3>${currentProvince}</h3>
              <div class="city-item" style="flex-direction:column;align-items:flex-start;gap:6px;">
                <span class="name" style="font-size:14px;color:#ffab40;font-weight:600;">${currentProvince}</span>
                <span style="font-size:11px;color:#5a7a9e;">直辖市 · 全市通用</span>
                <span class="plate" style="font-size:14px;color:#ffab40;">${plateStr}</span>
              </div>
              <div style="font-size:11px;color:#5a7a9e;margin-top:12px;line-height:1.8;">
                双击地图区域可返回全国视图
              </div>
            `;
            return;
          }

          let html = `<h3>${currentProvince}（${PROVINCE_INFO[currentProvince].short}）</h3>`;
          html += `<div style="font-size:11px;color:#5a7a9e;margin-bottom:8px;">共 ${cities.length} 个地级市</div>`;
          cities.forEach(city => {
            const pd = getPlateDisplay(city);
            if (!pd) return;
            const plateStr = pd.plate.join(" / ");
            const isMulti = pd.isMulti;
            html += `<div class="city-item ${isMulti ? 'multi' : ''}" style="cursor:pointer;" onclick="selectCity('${city}')">
              <span class="name">${city}</span>
              <span class="plate">${plateStr}</span>
            </div>`;
          });
          infoPanel.innerHTML = html;
        }
        return;
      }

      const pd = getPlateDisplay(cityName);
      if (!pd) {
        infoPanel.innerHTML = `<h3>${cityName}</h3><div class="empty-tip">暂无车牌数据</div>`;
        return;
      }
      const plateStr = pd.plate.join(" / ");
      const isMulti = pd.isMulti;
      const isDirect = pd.isDirect;

      let html = `<h3>${cityName}</h3>`;
      html += `<div class="city-item" style="flex-direction:column;align-items:flex-start;gap:8px;padding:14px;">
        <span style="font-size:12px;color:#8aa4c8;">车牌代码</span>
        <span style="font-size:20px;color:${isMulti ? '#ff6e40' : '#ffab40'};font-weight:700;letter-spacing:1px;">${plateStr}</span>`;
      if (isMulti) {
        html += `<span style="font-size:11px;color:#ff6e40;">⚠ 该城市拥有多个车牌字母</span>`;
      }
      if (isDirect) {
        html += `<span style="font-size:11px;color:#5a7a9e;">直辖市 · 全市通用，不区分具体区域</span>`;
      }
      html += `</div>`;

      const prov = getProvinceOfCity(cityName);
      if (prov && PROVINCE_CITY_MAP[prov]) {
        const siblings = PROVINCE_CITY_MAP[prov].filter(c => c !== cityName);
        if (siblings.length > 0) {
          html += `<div style="font-size:11px;color:#5a7a9e;margin-top:12px;margin-bottom:6px;">同省其他城市</div>`;
          siblings.slice(0, 8).forEach(c => {
            const d = getPlateDisplay(c);
            if (!d) return;
            html += `<div class="city-item ${d.isMulti ? 'multi' : ''}" style="cursor:pointer;opacity:0.75;" onclick="selectCity('${c}')">
              <span class="name">${c}</span>
              <span class="plate">${d.plate.join(" ")}</span>
            </div>`;
          });
          if (siblings.length > 8) {
            html += `<div style="font-size:11px;color:#5a7a9e;text-align:center;padding:4px;">…还有 ${siblings.length - 8} 个城市</div>`;
          }
        }
      }

      infoPanel.innerHTML = html;
    }

    // 点击侧栏城市名 → 高亮地图
    window.selectCity = function (cityName) {
      selectedCityName = cityName;
      updateInfoPanel(cityName);
      chart.dispatchAction({ type: "select", seriesIndex: 0, name: cityName });
      chart.dispatchAction({ type: "highlight", seriesIndex: 0, name: cityName });
    };

    // ============================================================
    // 事件监听
    // ============================================================
    provinceSelect.addEventListener("change", (e) => {
      const val = e.target.value;
      if (val === "china") {
        renderChinaMap();
      } else {
        drillToProvince(val);
      }
    });

    backBtn.addEventListener("click", () => {
      provinceSelect.value = "china";
      renderChinaMap();
    });

    window.addEventListener("resize", () => chart.resize());

    // ============================================================
    // 启动
    // ============================================================
    renderChinaMap();
  </script>
</body>
</html>
